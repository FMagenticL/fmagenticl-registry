name: Automated Registry Harvest

concurrency:
  group: registry-writer
  cancel-in-progress: false

on:
  schedule:
    # Run hourly at 11 minutes past the hour to avoid queue drops and agent polling bursts
    - cron: '11 * * * *'
  workflow_dispatch: # Allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  harvest-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Log GitHub rate limit (start)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit --jq '{core: .resources.core, graphql: .resources.graphql}'

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (for Wrangler D1 updates)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography pybloom-live httpx
          npm install -g wrangler

      - name: Run GitHub Harvester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Harvests up to 10 issues per repo to avoid rate limits
          python scripts/harvest_github_failures.py --limit 10 --output harvested_candidates.json

      - name: Run OSV Advisory Harvester
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/harvest_osv_advisories.py

      - name: Run Harvest Orchestrator (Multi-Source Live D1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/harvest_orchestrator.py --live-d1

      - name: Promote Harvested Candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Promotes candidates to patches/ and updates D1
          python scripts/promote_d1_to_registry.py --source-json harvested_candidates.json --apply
          python scripts/migrate_d1.py --backfill-simhash --max-batches 5 || true

      - name: Rebuild Distribution & Static Exports
        env:
          FMAGENTICL_SIGNING_KEY: ${{ secrets.FMAGENTICL_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/export_db_to_static.py
          python scripts/build_distribution.py

      - name: Archive Daily Cloudflare Analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/archive_cf_analytics.py

      - name: Stage Changes & Run CI Seatbelts
        id: seatbelt-step
        run: |
          [ -f data/osv_seen_cache.json ] || echo "{}" > data/osv_seen_cache.json
            git add -A patches/ dist/ fmagenticl/data/snapshot.json fmagenticl/data/snapshot.sig fmagenticl/server/seed_hermes.py data/analytics_archive/ data/osv_seen_cache.json
          if git diff --staged --quiet; then
            echo "No changes staged. Skipping test gates."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected. Running load-bearing CI seatbelt gates..."
            python scripts/air_gap_scan.py --staged
            # F4 (2026-11-25): run the WHOLE suite. This replaces a 7-file allowlist which is
            # why a tests/ tree that could not even be collected stayed "green" for 20 days /
            # 186 commits (commit 5bdeeba removed a function a test imported).
            # KNOWN_RED is a DATED expected-red list. Delete each entry as its F-item closes;
            # F1 (re-sign with the matching key) is expected to clear all four. An empty list
            # here means the suite is green - there is no other way to pass this gate.
            # Evidence: Crew/traces/fmagenticl/2026-11-23T2151Z-fmagenticl-prereq/
            KNOWN_RED=(
              "tests/test_airgap_runtime.py::test_airgap_zero_network_on_init_and_tier1_resolve"
              "tests/test_build_distribution.py::test_build_distribution_execution"
              "tests/test_registry_integrity.py::test_resolve_and_snapshot_dual_signatures"
              "tests/test_registry_integrity.py::test_local_cache_offline_staleness_alias_and_breaker"
            )
            DESELECT=()
            for t in "${KNOWN_RED[@]}"; do DESELECT+=(--deselect "$t"); done
            python -m pytest tests/ -v "${DESELECT[@]}"
            # Tree-integrity guard (F4, 2026-11-25). Harvest output is already STAGED above, so
            # any unstaged or untracked change under build/data paths was written by a test.
            # Discard test scribbles (restoring from the INDEX, so staged harvest data is preserved)
            # and clean untracked test side-effects before committing.
            if ! git diff --quiet -- dist/ patches/ fmagenticl/ data/ || [ -n "$(git ls-files --others --exclude-standard -- dist/ patches/ fmagenticl/ data/)" ]; then
              echo "::warning::Tests mutated build/data outputs -- listing then discarding test side-effects"
              git diff --name-only -- dist/ patches/ fmagenticl/ data/
              git ls-files --others --exclude-standard -- dist/ patches/ fmagenticl/ data/
              git checkout -- dist/ patches/ fmagenticl/ data/
              git clean -fd -- dist/ patches/ fmagenticl/ data/
            fi
            [ -f data/osv_seen_cache.json ] || echo "{}" > data/osv_seen_cache.json
            git add -A patches/ dist/ fmagenticl/data/snapshot.json fmagenticl/data/snapshot.sig fmagenticl/server/seed_hermes.py data/analytics_archive/ data/osv_seen_cache.json
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Changes
        if: steps.seatbelt-step.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "FMagenticL Harvester Bot"
          git config --global user.email "harvester@fmagenticl-registry.pages.dev"
          [ -f data/osv_seen_cache.json ] || echo "{}" > data/osv_seen_cache.json
            git add -A patches/ dist/ fmagenticl/data/snapshot.json fmagenticl/data/snapshot.sig fmagenticl/server/seed_hermes.py data/analytics_archive/ data/osv_seen_cache.json
          git commit -m "[BOT] chore(harvest): automated hourly harvesting and patch promotion" || echo "No changes to commit"
          git pull --rebase --autostash origin main || (git rebase --abort 2>/dev/null || true; git pull --no-rebase origin main)
          git push origin main || git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Deploy to Cloudflare Pages CDN
        if: steps.seatbelt-step.outputs.has_changes == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=fmagenticl-registry --branch=main

      - name: Log GitHub rate limit (end)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api rate_limit --jq '{core: .resources.core, graphql: .resources.graphql}'
