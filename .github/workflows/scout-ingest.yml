name: Automated Threat-Intel Scout (PR-Only)

concurrency:
  group: scout-ingest
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scout-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml

      - name: Run multi-source Threat-Intel Scout (CISA KEV, GHSA, OSV MAL-*)
        run: python scripts/scout_threat_intel.py --stage-signatures

      - name: Verify lint and air-gap quarantine gates
        run: |
          python scripts/registry_lint_gate.py
          python scripts/air_gap_scan.py

      - name: Open Pull Request if new candidate signatures were staged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain signatures/)" ]; then
            echo "No new eligible candidate signatures found."
            exit 0
          fi
          BRANCH="scout/auto-ingest-$(date -u +%Y%m%d%H%M)"
          git config user.name "fmagenticl-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add signatures/
          git commit -m "chore(scout): stage new threat-intel candidate signatures"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(scout): stage new threat-intel candidate signatures" \
            --body "Automated PR generated by \`scripts/scout_threat_intel.py\` (CISA KEV, GHSA CC-BY-4.0, OpenSSF/OSV MAL-* with \`withdrawn == null\` filter). Passed \`registry_lint_gate.py\` and \`air_gap_scan.py\`." \
            --base main \
            --head "$BRANCH"
