[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmagenticl"
version = "3.0.0"
description = "FMagenticL Signed Open Registry of Malicious AI Agent Signatures, Offensive Harnesses & Behavioral IOCs"
readme = "README.md"
authors = [{ name = "FMagenticL Collective", email = "maintainers@fmagenticl.org" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "requests>=2.30.0",
    "pydantic>=1.10.0,<3.0.0",
    "cryptography>=41.0.0",
    "jsonpatch>=1.33",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=0.1.0",
]

[project.scripts]
fmagenticl-mcp = "fmagenticl.client.fastmcp_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fmagenticl*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
fmagenticl = [
    "data/snapshot.json",
    "data/snapshot.sig",
    "data/snapshot.v3.sig",
    "data/keyring.json",
    "schema/*.json",
]
