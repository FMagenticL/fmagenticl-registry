[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmagenticl"
version = "1.4.0"
description = "FMagenticL Self-Healing Registry Daemon, Client, and Remote Streamable MCP"
readme = "README.md"
authors = [{ name = "FMagenticL Collective", email = "maintainers@fmagenticl.org" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "jsonpatch>=1.33",
]

[project.optional-dependencies]
daemon = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "redis>=5.0.0",
]

[project.scripts]
fmagenticl-server = "fmagenticl.server.main:main"
