[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmagenticl"
version = "1.4.1"
description = "FMagenticL Self-Healing Registry Daemon, Client, and Remote Streamable MCP"
readme = "README.md"
authors = [{ name = "FMagenticL Collective", email = "maintainers@fmagenticl.org" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "requests>=2.30.0",
    "pydantic>=1.10.0,<3.0.0",
    "cryptography>=41.0.0",
    "jsonpatch>=1.33",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "redis>=5.0.0",
]
daemon = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "redis>=5.0.0",
]
mcp = [
    "fastmcp>=0.1.0",
]

[project.scripts]
fmagenticl-mcp = "fmagenticl.client.fastmcp_server:main"
fmagenticl-server = "fmagenticl.server.main:main"
